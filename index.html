<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Fr. Solomon Anthony Nirmalan, CMF">
<meta name="description" content="A reflection on prayer, chastity, poverty and obedience in community life, for sisters preparing to renew their vows.">
<title>Living My Vows</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: one calm card per screen, centred column, progress thread across the top */
:root{
  --bg:#FAF0D2; --surface:#FFFAEB; --ink:#3A2A1D; --muted:#76604D;
  --line:#E6D3A8; --accent:#7A4A2B; --accent-soft:#F2E0BC; --gold:#A8732A;
  --display:"Spectral", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:calc(24px + env(safe-area-inset-top, 0px));padding-bottom:calc(48px + env(safe-area-inset-bottom, 0px))}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:2.1rem}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.byline{font-size:.95rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.verse{font-family:var(--display);font-style:italic;font-size:1.1rem;color:var(--muted);border-left:2px solid var(--gold);padding-left:14px}
.verse cite{display:block;font-style:normal;font-size:.85rem;margin-top:4px;font-family:var(--body)}
.meta{color:var(--muted);font-size:.95rem}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--surface);border:0;border-radius:999px;padding:12px 22px;font-weight:600;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:focus-visible,.opt:focus-visible,.link:focus-visible,.none-opt:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;color:var(--muted);padding:6px 0;text-decoration:underline}

.progress{display:flex;flex-direction:column;gap:8px}
.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--accent);transition:width .35s ease}
.step{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.vowtag{color:var(--gold);font-weight:600}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 16px;line-height:1.4;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--accent)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.none-opt{background:none;border:0;border-top:1px dashed var(--line);color:var(--muted);text-align:left;padding:12px 2px 2px;font-size:.95rem}
.none-opt.picked{color:var(--accent);font-weight:600}
.notebox{display:flex;flex-direction:column;gap:10px}

.bars{display:flex;flex-direction:column;gap:14px}
.bar-head{display:flex;justify-content:space-between;gap:8px;font-size:.95rem;flex-wrap:wrap}
.bar-head b{font-family:var(--display);font-size:1.05rem}
.bar-head span{color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.bar.gold i{background:var(--gold)}
.unscored{font-size:.92rem;font-style:italic;color:var(--muted);margin-top:4px}
.root-note{font-size:.95rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.pill{display:inline-block;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;align-self:flex-start}
.pill.gold{color:var(--gold)}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.words{display:flex;flex-direction:column;gap:14px}
.words div{display:flex;flex-direction:column;gap:4px}
.words .q{font-size:.92rem;color:var(--muted)}
.words .a{font-family:var(--display);font-style:italic}
label{font-weight:600;font-size:.95rem}
textarea{font:inherit;width:100%;box-sizing:border-box;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.note{font-size:.88rem;color:var(--muted)}
.toast{font-size:.9rem;color:var(--accent)}
.credit{max-width:560px;margin:32px auto 0;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:.88rem;color:var(--muted)}
.credit b{font-family:var(--display);font-weight:600;color:var(--ink)}
.about{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 20px}
.about summary{cursor:pointer;padding:16px 0;font-family:var(--display);font-weight:600;font-size:1.1rem;list-style-position:inside}
.about summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.about .about-body{display:flex;flex-direction:column;gap:12px;padding-bottom:20px}
.about .dev-name{font-family:var(--display);font-weight:600;font-size:1.05rem}
.about .langs{font-size:.92rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.fill,.opt{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<footer class="credit">Prepared by <b>Fr. Solomon Anthony Nirmalan, CMF</b></footer>

<script>
const ORDER = ["L","M","C","P","O"];
const VOWS = {
  L:{name:"Prayer and Life", short:"prayer that reaches my hands",
     verse:"But a Samaritan traveller who came upon him was moved with compassion at the sight.", ref:"Luke 10:33",
     strong:"Your prayer seems to reach your daily life. It makes you notice people, and it makes you patient and caring. Thank the Lord for this. Ask him to keep your eyes open to the person in front of you.",
     grow:"The Lord may be inviting you to let your prayer touch your daily life more: how you notice people, how you care for them, and how patient and gentle you are after you leave the chapel.",
     question:"In the parable, the priest and the Levite passed by. When have I passed by someone because I was busy with holy things?",
     steps:["Before you leave the chapel, name one person you will serve with more patience today.","Bring the faces of the people you serve into your prayer, one by one, by name.","At night, ask: where did I meet the Lord in a person today, and where did I pass by?"]},
  M:{name:"Community Life", short:"one body, sent out and welcomed home",
     verse:"That they may all be one, as you, Father, are in me and I in you... so that the world may believe that you sent me.", ref:"John 17:21",
     strong:"You seem to help make your community a real home. You keep its life even when you are busy, you welcome sisters who come back from mission, and you say thank you. Thank God for this. A united house is the first witness of our mission.",
     grow:"The Lord may be inviting you to give more to the life of your community: to keep its prayer and table even in busy times, to welcome the sister who comes home tired, and to say aloud what you appreciate in others.",
     question:"Is my community a place I go out from and come back to with joy? What part of that depends on me?",
     steps:["Keep one community meal and one recreation this week, whatever your work.","When a sister comes home from mission, ask her one question about her day and really listen.","Tell one sister each day, simply, something you appreciate in her."]},
  C:{name:"Chastity", short:"a heart that loves freely",
     verse:"Lord, you know everything; you know that I love you.", ref:"John 21:17",
     strong:"Your heart seems to rest in the Lord, and your love for your sisters is warm and open. Thank God for this gift. Ask how you can share this warmth with a sister who feels left out.",
     grow:"The Lord may be inviting you to look at where your heart goes when you are tired or lonely, and how open your love is to every sister in the house.",
     question:"If Jesus asked me today, \"Do you love me more than these?\", what are \"these\" in my life right now?",
     steps:["Give the Lord a few quiet minutes when you come home tired, before anything else.","Sit with a sister you rarely talk to, at one meal this week.","Keep your phone away during prayer and community time."]},
  P:{name:"Poverty", short:"open hands, shared life",
     verse:"The community of believers was of one heart and mind, and no one claimed that any of their possessions was their own.", ref:"Acts 4:32",
     strong:"You seem free with your things, your time and your gifts. This openness builds trust in the community. Ask the Lord to keep your hands open, especially with your time.",
     grow:"The Lord may be inviting you to open your hand on something you hold tightly: your time, a skill, a role, or some quiet possessions.",
     question:"What is one thing I find hard to share, and is the Lord asking me to let go of it this year?",
     steps:["Offer one hour each week to a sister who needs company or help.","Teach someone a task that only you know how to do.","Look at your room and return what you do not need to the common store."]},
  O:{name:"Obedience", short:"listening together for God's will",
     verse:"Speak, Lord, for your servant is listening.", ref:"1 Samuel 3:10",
     strong:"You seem able to listen, to speak honestly and to let go of your own will with peace. This makes community decisions easier for everyone. Ask the Lord to keep your listening deep.",
     grow:"The Lord may be inviting you to listen more deeply, to speak honestly before decisions, and to accept with a peaceful heart afterwards.",
     question:"When was obedience last hard for me, and what was the Lord trying to teach me through it?",
     steps:["In the next community meeting, listen fully before you respond.","If you disagree with a decision, speak to the superior directly, not to others.","Pray each morning: \"Speak, Lord, your servant is listening.\""]}
};

const QUESTIONS = [
  {v:"L", q:"You are on your way to the chapel for adoration when a worker stops you. She is upset about a problem at home. What do you usually do?", o:[
    ["I tell her kindly that I will speak with her after prayer, and I make sure I do.",2],
    ["I listen quickly, but my mind is on reaching the chapel on time.",1],
    ["I stop and listen to her. The Lord in the chapel will wait for me.",3],
    ["I tell her to come back later, and then I forget about it.",0]]},
  {v:"M", q:"It is a busy season in the mission. How much of community life do you keep, such as prayer, meals and recreation together?", o:[
    ["I try, but I am often late or my mind is on my work.",2],
    ["Very little. The mission comes first, and the community understands.",0],
    ["I keep most of it, even when it costs me some work.",3],
    ["I keep community prayer, but I usually miss meals and recreation.",1]]},
  {v:"C", q:"After a long and tiring day in the mission, you come home feeling lonely and unseen. What do you usually do?", o:[
    ["I pick up my phone and scroll until I feel better.",1],
    ["I spend a few quiet minutes with the Lord in the chapel and tell him how I feel.",3],
    ["I keep it to myself and become a little cold with the sisters.",0],
    ["I share it simply with a sister I trust.",2]]},
  {v:"P", q:"A relative gives you some money personally for your feast day. What do you do with it?", o:[
    ["I keep part of it for my small needs and give the rest.",1],
    ["I tell the superior and ask how I may use it.",2],
    ["I keep it quietly. It was a personal gift.",0],
    ["I hand it to the community, as our Constitutions ask.",3]]},
  {v:"O", q:"The superior makes a decision that you do not agree with. What is closest to your response?", o:[
    ["I share my view honestly and respectfully, then accept the decision in peace.",3],
    ["I accept it, but I complain about it to one or two sisters.",1],
    ["I accept it in silence, though my heart feels heavy for a while.",2],
    ["I say yes, but I quietly do things my own way.",0]]},
  {v:"L", q:"You come out of morning prayer and Mass. Soon after, someone irritates you. How do you usually respond?", o:[
    ["I am as impatient as usual. Prayer and daily life feel like two separate worlds.",0],
    ["I see her as someone the Lord has placed in front of me, and I treat her gently.",3],
    ["I stay polite to her face, but I complain about her later.",1],
    ["I try to be patient, and often something from my prayer comes back to me.",2]]},
  {v:"M", q:"You come home after a hard week in the mission, and no one asks about your work. What do you usually do?", o:[
    ["I feel hurt and withdraw to my room for the evening.",1],
    ["I share a little about my week, and I still do my part in the house.",3],
    ["I complain to a sister that nobody cares about what I do.",0],
    ["I let it go, though it hurts a little, and I do my part in the house.",2]]},
  {v:"C", q:"In your community, the same two or three sisters always sit and talk together. You are one of them. What do you do?", o:[
    ["I see it is natural. Everyone has close friends.",1],
    ["I notice it, but I find it hard to change.",2],
    ["I prefer it this way. The other sisters are difficult.",0],
    ["I make a real effort to include others and widen the circle.",3]]},
  {v:"P", q:"A younger sister asks you to teach her the work you do well, like the accounts or the sacristy. How do you respond?", o:[
    ["I teach her gladly and let her try, even if she makes mistakes.",3],
    ["I tell her I am too busy right now.",1],
    ["I teach her, but I keep the important parts to myself.",2],
    ["Honestly, I feel nobody can do it as well as I do.",0]]},
  {v:"O", q:"In a community meeting where an important matter is being discerned, what do you usually do?", o:[
    ["I say what I think, but I do not really listen to the others.",1],
    ["I stay silent in the meeting and share my real opinion afterwards.",0],
    ["I speak honestly and listen carefully to every sister.",3],
    ["I listen well, but I rarely share my own view.",2]]},
  {v:"L", q:"Do the faces of the people you serve, the sick, the poor, the children, come into your prayer?", o:[
    ["Rarely. My prayer is mostly the Office and my own needs.",1],
    ["Often. I bring them before the Lord by name.",3],
    ["Not really. I keep my prayer and my work apart.",0],
    ["Sometimes, when someone's situation is very serious.",2]]},
  {v:"M", q:"A sister comes home late and worn out from an outreach programme. How do you welcome her?", o:[
    ["I keep some food for her, ask how it went, and let her rest.",3],
    ["I greet her, but I do not really ask about her day.",1],
    ["I remind her of the house duties she missed.",0],
    ["I keep food for her, but I am too busy to sit with her.",2]]},
  {v:"C", q:"During recreation, a sister begins to speak badly about another sister who is not present. What do you do?", o:[
    ["I listen with interest.",1],
    ["I add something I know about her too.",0],
    ["I gently change the topic or say something kind about the absent sister.",3],
    ["I stay quiet and wait for it to pass.",2]]},
  {v:"P", q:"A sister who is unwell or elderly needs someone to sit with her after supper, during your free hour. What do you do?", o:[
    ["I give my time freely. Being with her is also mission.",3],
    ["I go sometimes, when I am not too tired.",2],
    ["I usually find a reason to avoid it.",0],
    ["I rarely go. My free hour is precious to me.",1]]},
  {v:"O", q:"You are asked to leave your present mission and go to a new place far away. What is your first response?", o:[
    ["I agree, but I hope inside that the decision will change.",1],
    ["I need some time to pray, and then I am ready to go.",2],
    ["I look for good reasons why I should not be sent.",0],
    ["I say, \"Here I am, send me,\" with trust in the Lord.",3]]},
  {v:"L", q:"For several days, a sister has been quiet and sad at table. What do you do?", o:[
    ["I notice it and I pray for her, but I do not go to her.",1],
    ["I go to her gently, ask how she is, and keep her in my prayer.",3],
    ["I did not really notice. I am busy with my own things.",0],
    ["I mention it to the superior so that someone can help her.",2]]},
  {v:"M", q:"When a sister does something well, like a good meal, a hard task finished, or a success in her mission, what do you usually do?", o:[
    ["I appreciate her in my heart, but I rarely say it.",2],
    ["I notice more easily what she did wrong.",0],
    ["I tell her simply and sincerely, and sometimes in front of others.",3],
    ["I find it hard to praise her, especially when others are already praising her.",1]]},
  {v:"M", check:true, q:"Do you feel appreciated in your community?", note:"This answer is not part of your result. It is only for you, and for your prayer.", o:[
    ["Yes, mostly.",0],
    ["Sometimes.",1],
    ["Rarely.",2],
    ["I often feel taken for granted.",3]]},
  {v:"C", q:"How would you describe the place of your phone in your life in community?", o:[
    ["It stays away during prayer, meals and community time.",3],
    ["It is often the first and last thing I look at each day.",1],
    ["I check it now and then during community time.",2],
    ["If I am honest, it gets more of my attention than the sisters in my house.",0]]},
  {v:"P", q:"When you look at your room and your cupboard, what do you see?", o:[
    ["Some extra things, but I would give them up without much difficulty.",2],
    ["Many things that I would find hard to let go of.",1],
    ["Only what I need, and I share things easily.",3],
    ["I would rather not look too closely.",0]]},
  {v:"O", q:"A sister gently points out something in your behaviour that hurt her. How do you receive it?", o:[
    ["I listen, though I feel defensive inside.",2],
    ["I hold it against her for a long time.",0],
    ["I receive it openly and thank her for her honesty.",3],
    ["I immediately explain why I acted that way.",1]]}
];

const N = QUESTIONS.length;
const app = document.getElementById("app");
let i = 0;
let answers = new Array(N).fill(null);   // number = option index, "none" = none of these
let notes = new Array(N).fill("");
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}

function intro(){
  app.innerHTML = `
    <div class="card">
      <span class="eyebrow">Day of Recollection</span>
      <h1>Living My Vows</h1>
      <p class="byline">A reflection by Fr. Solomon Anthony Nirmalan, CMF</p>
      <p>Before you renew your vows, take a few quiet minutes with this reflection. You will meet twenty simple situations from prayer and community life, and one quiet question about how you feel at home. Choose the answer that is closest to how you really live, not how you would like to live.</p>
      <p>If none of the answers truly fits you, you may choose "None of these describes me" and write a few words of your own. Use it only when none truly fits.</p>
      <p class="verse">I will lead her into the desert and speak to her heart.<cite>Hosea 2:14</cite></p>
      <p class="meta">20 situations and 1 check-in · about 14 minutes · your answers stay on this phone</p>
      <button class="btn" id="start">Begin in prayer</button>
    </div>
    <p class="note">This is a mirror for prayer, not a test. No one sees your answers, and there are no marks.</p>
    <details class="about" id="about">
      <summary>About this reflection</summary>
      <div class="about-body">
        <p>Living My Vows is a short reflection for consecrated women preparing to renew their vows. It was prepared for a day of recollection on chastity, poverty and obedience as they are lived in community. Prayer is the root of all three, and community is the home we go out from in mission and come back to.</p>
        <p>You meet twenty situations from everyday convent and mission life and choose the answer closest to how you really live. At the end you see which area is a gift to thank God for and which one is an invitation to grow. Each comes with a passage from Scripture, a question for prayer and a few small steps for the week. You can then write your own renewal intention.</p>
        <p>The reflection is a mirror for personal prayer. It is not a test or an evaluation, and its results should not be used to compare sisters. Nothing is sent anywhere. Your answers stay only on your own phone.</p>
      </div>
    </details>
    <details class="about" id="developer">
      <summary>About the developer</summary>
      <div class="about-body">
        <p class="dev-name">Fr. Solomon Anthony Nirmalan, CMF</p>
        <p>Fr. Solomon Anthony Nirmalan, CMF, is a Claretian Missionary priest with 15 years of ministry and a behavioural researcher. He is currently pursuing a Master of Arts in Behavioural Sciences, Track in Organizational and Social Systems Development, at De La Salle University. He holds bachelor's degrees in Philosophy and Theology from the National Seminary of Sri Lanka, affiliated with the Pontifical Urbaniana University in Rome.</p>
        <p>Leadership is at the centre of his work. He studies how leaders shape organizations and communities, and his thesis focuses on transformative leadership. His research is guided by theoretical pluralism: drawing on several behavioural frameworks together to understand how people make decisions and adapt.</p>
        <p>He works in applied behavioural science, organizational and leadership dynamics, and environmental psychology, using mixed methods to turn theoretical models into practical tools with real-world impact. His wider interests include community development, socio-economic welfare, social and institutional change, and social justice for marginalized communities.</p>
        <p class="langs">He is fluent in Tamil, Sinhala and English.</p>
      </div>
    </details>`;
  document.getElementById("start").onclick = ()=>{i=0;question();};
}

function next(){
  if(i<N-1){i++;question();} else result();
}

function question(){
  const item = QUESTIONS[i], pct = Math.round(i/N*100);
  const isNone = answers[i]==="none";
  app.innerHTML = `
    <div class="progress">
      <div class="step"><span class="vowtag">${item.check?"A quiet check-in":VOWS[item.v].name}</span><span>${i+1} of ${N}</span></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    </div>
    <div class="card">
      <h2>${esc(item.q)}</h2>
      ${item.note?`<p class="note">${esc(item.note)}</p>`:""}
      <div class="opts">${item.o.map((o,k)=>`<button class="opt${answers[i]===k?" picked":""}" data-k="${k}" id="opt-${i}-${k}">${esc(o[0])}</button>`).join("")}</div>
      ${item.check?"":`<button class="none-opt${isNone?" picked":""}" id="none-${i}">None of these describes me</button>
      <div class="notebox" id="notebox"${isNone?"":" hidden"}>
        <label for="note-${i}">In a few words, what would you do? (optional)</label>
        <textarea id="note-${i}" placeholder="Write it as you would say it to the Lord">${esc(notes[i])}</textarea>
        <button class="btn" id="cont">Continue</button>
      </div>`}
    </div>
    <div class="row">${i>0?`<button class="link" id="back">Back</button>`:""}</div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    answers[i]=+b.dataset.k; notes[i]="";
    app.querySelectorAll(".opt").forEach(x=>x.classList.remove("picked"));
    b.classList.add("picked");
    setTimeout(next,220);
  });
  if(!item.check) document.getElementById("none-"+i).onclick=()=>{
    answers[i]="none";
    app.querySelectorAll(".opt").forEach(x=>x.classList.remove("picked"));
    document.getElementById("none-"+i).classList.add("picked");
    document.getElementById("notebox").hidden=false;
    document.getElementById("note-"+i).focus();
  };
  if(!item.check) document.getElementById("cont").onclick=()=>{
    notes[i]=document.getElementById("note-"+i).value.trim();
    next();
  };
  const back=document.getElementById("back"); if(back) back.onclick=()=>{i--;question();};
  window.scrollTo(0,0);
}

function level(r){
  if(r>=0.83) return "Deeply rooted";
  if(r>=0.58) return "Growing steadily";
  if(r>=0.33) return "Asking for care";
  return "Calling for attention";
}

function computeScores(){
  const out={};
  ORDER.forEach(v=>{
    let sum=0, answered=0, skipped=0;
    QUESTIONS.forEach((q,k)=>{
      if(q.v!==v||q.check) return;
      if(answers[k]==="none"||answers[k]===null){skipped++;return;}
      sum+=q.o[answers[k]][1]; answered++;
    });
    out[v] = skipped>=2 ? null : sum/(answered*3);
  });
  return out;
}

function result(){
  const score = computeScores();
  const scored = ORDER.filter(v=>score[v]!==null);
  let strong=null, grow=null;
  if(scored.length){
    strong=scored.reduce((a,b)=>score[b]>score[a]?b:a);
    grow=scored.reduce((a,b)=>score[b]<score[a]?b:a);
  }
  const balanced = !scored.length || score[strong]===score[grow];
  const ci = QUESTIONS.findIndex(q=>q.check);
  const felt = answers[ci];
  let feltCard = "";
  if(felt===2||felt===3){
    feltCard = `
    <div class="card">
      <span class="pill gold">A word for you</span>
      <h2>You are precious</h2>
      <p class="verse">You are precious in my eyes, and honoured, and I love you.<cite>Isaiah 43:4</cite></p>
      <p>It hurts to give yourself in the mission and feel unnoticed at home. Bring this hurt to the Lord, who sees everything you do. If you can, share it gently with a sister you trust or with your superior.</p>
      <p>Remember too that appreciation often begins to grow in a house when one person starts giving it. You may be that person.</p>
    </div>`;
  } else if(felt===1){
    feltCard = `
    <div class="card">
      <span class="pill">A word for you</span>
      <h2>Seen at times</h2>
      <p>Thank God for the moments when you feel seen and valued. Then look around your house. Another sister may be waiting for a word of appreciation, and you can give it.</p>
    </div>`;
  } else if(felt===0){
    feltCard = `
    <div class="card">
      <span class="pill">A word for you</span>
      <h2>A gift to give thanks for</h2>
      <p>You feel appreciated in your community. Thank God for your sisters, and tell one of them this week how much that means to you.</p>
    </div>`;
  }
  const own = QUESTIONS.map((q,k)=>({q:q.q,v:q.v,n:notes[k]})).filter((x,k)=>answers[k]==="none"&&x.n);

  let middle;
  if(!scored.length){
    middle = `
    <div class="card">
      <span class="pill">A quiet invitation</span>
      <h2>Stay with these questions</h2>
      <p>You found it hard to place yourself in many of these situations. That is all right. Go back to the questions that touched you most and stay with them in prayer.</p>
    </div>`;
  } else if(balanced){
    middle = `
    <div class="card">
      <span class="pill">Prayer, community and the vows</span>
      <h2>Living it as one</h2>
      <p>Your answers are balanced across the areas you answered. Thank the Lord for this. Pray with the one area you feel most drawn to deepen as you prepare to renew.</p>
    </div>`;
  } else {
    const s=VOWS[strong], g=VOWS[grow];
    middle = (score[strong]>=0.58 ? `
    <div class="card">
      <span class="pill">A gift to give thanks for</span>
      <h2>${s.name}: ${s.short}</h2>
      <p>${s.strong}</p>
    </div>` : "") + `
    <div class="card">
      <span class="pill gold">An invitation to grow</span>
      <h2>${g.name}: ${g.short}</h2>
      <p>${g.grow}</p>
      <p class="verse">${g.verse}<cite>${g.ref}</cite></p>
      <h3>Take this question into prayer</h3>
      <p>${esc(g.question)}</p>
      <h3>One small step for this week</h3>
      <ul class="plain">${g.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    </div>`;
  }

  app.innerHTML = `
    <div class="card">
      <span class="eyebrow">Your reflection</span>
      <h1>What the Lord may be saying</h1>
      <p>Read this slowly. It is not a judgement on your vocation. It is only a light on where you are today.</p>
      <div class="bars">${ORDER.map(v=>{
        const r=score[v];
        if(r===null) return `
        <div>
          <div class="bar-head"><b>${VOWS[v].name}</b></div>
          <p class="unscored">You found it hard to place yourself in these situations. Stay with this area in prayer.</p>
        </div>`;
        return `
        <div>
          <div class="bar-head"><b>${VOWS[v].name}</b><span>${level(r)}</span></div>
          <div class="bar${v===grow&&!balanced?" gold":""}"><i style="width:${Math.max(4,Math.round(r*100))}%"></i></div>
        </div>`;}).join("")}</div>
      <p class="root-note">Prayer is the root. Community is the home we go out from and come back to. Chastity, poverty and obedience are its fruit.</p>
    </div>

    ${middle}

    ${feltCard}

    ${own.length?`
    <div class="card">
      <span class="eyebrow">In your own words</span>
      <h2>What you wrote</h2>
      <div class="words">${own.map(x=>`<div><span class="q">${esc(x.q)}</span><span class="a">${esc(x.n)}</span></div>`).join("")}</div>
      <p class="note">Read these again slowly. They may say more than any of the answers.</p>
    </div>`:""}

    <div class="card">
      <span class="eyebrow">Before you renew</span>
      <h2>My renewal intention</h2>
      <p>Lord, when I renew my vows, I want to live them especially in my community by...</p>
      <div class="field"><label for="in-l">Prayer and life</label><textarea id="in-l" placeholder="for example, letting my prayer make me patient with the people I serve"></textarea></div>
      <div class="field"><label for="in-m">Community life</label><textarea id="in-m" placeholder="for example, welcoming every sister who comes home from mission"></textarea></div>
      <div class="field"><label for="in-c">Chastity</label><textarea id="in-c" placeholder="for example, giving warm attention to every sister"></textarea></div>
      <div class="field"><label for="in-p">Poverty</label><textarea id="in-p" placeholder="for example, offering my free hour to our older sisters"></textarea></div>
      <div class="field"><label for="in-o">Obedience</label><textarea id="in-o" placeholder="for example, listening fully before I speak"></textarea></div>
      <div class="row"><button class="btn" id="copy">Copy my intention</button><span class="toast" id="toast" hidden></span></div>
      <p class="note">Copy it into your notes or write it on the card you will keep in your Bible. It is saved only on this phone.</p>
    </div>

    <p class="verse">Remain in my love. Love one another as I have loved you.<cite>John 15:9, 12</cite></p>
    <div class="row"><button class="btn ghost" id="again">Begin again</button><button class="link" id="review">Review my answers</button></div>`;

  ["l","m","c","p","o"].forEach(k=>{
    const t=document.getElementById("in-"+k);
    t.value=store.get("lmv-"+k)||"";
    t.oninput=()=>store.set("lmv-"+k,t.value);
  });
  document.getElementById("copy").onclick=()=>{
    const v=k=>document.getElementById("in-"+k).value.trim()||"...";
    const text=`Lord, when I renew my vows, I want to let my prayer reach my life by ${v("l")}, to build up my community by ${v("m")}, and to live chastity by ${v("c")}, poverty by ${v("p")}, and obedience by ${v("o")}, especially in my community. Amen.`;
    const toast=document.getElementById("toast");
    const done=m=>{toast.textContent=m;toast.hidden=false;};
    try{
      navigator.clipboard.writeText(text).then(()=>done("Copied"),()=>{done("Select the text below to copy");fallback(text);});
    }catch(e){done("Select the text below to copy");fallback(text);}
  };
  document.getElementById("again").onclick=()=>{answers.fill(null);notes.fill("");intro();window.scrollTo(0,0);};
  document.getElementById("review").onclick=()=>{i=0;question();};
  window.scrollTo(0,0);
}

function fallback(text){
  let box=document.getElementById("copybox");
  if(!box){box=document.createElement("textarea");box.id="copybox";box.readOnly=true;document.getElementById("copy").closest(".card").appendChild(box);}
  box.value=text;box.focus();box.select();
}

intro();
</script>
</body>
</html>
